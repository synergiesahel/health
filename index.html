<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Centre d'Intelligence des Données — Situation Room MSPP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=Syne:wght@600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    /* PPTX palette — bleu royal */
    --royal: #1E40AF;
    --royal-d: #1E3A8A;
    --royal-l: #3B82F6;
    --royal-pale: #DBEAFE;
    --royal-tint: #EFF6FF;
    /* Active / accent */
    --gold: #FACC15;
    --gold-d: #CA8A04;
    --gold-tint: #FEF9C3;
    /* Backgrounds */
    --bg: #F1F5F9;
    --surface: #FFFFFF;
    --surface-2: #F8FAFC;
    --border: #E2E8F0;
    --border-2: #CBD5E1;
    /* Text */
    --ink: #0F172A;
    --body: #1E293B;
    --muted: #64748B;
    --muted-2: #94A3B8;
    /* RAG (4 colors — saturated) */
    --rag-green: #15803D;
    --rag-green-l: #BBF7D0;
    --rag-yellow: #CA8A04;
    --rag-yellow-l: #FEF3C7;
    --rag-orange: #C2410C;
    --rag-orange-l: #FFEDD5;
    --rag-red: #991B1B;
    --rag-red-l: #FECACA;
    --rag-na: #94A3B8;
    --rag-na-l: #E2E8F0;
    /* Direction colors */
    --dir-vacc: #1D4ED8;
    --dir-dsr: #DB2777;
    --dir-dsc: #059669;
    --dir-dpml: #EA580C;
    --dir-dpsis: #475569;
    --dir-drh: #7C3AED;
    --dir-cousp: #DC2626;
    --dir-prog: #0891B2;
    /* PDA specific */
    --pda: #2563EB;
    --pda-tint: #DBEAFE;

    --font: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    --font-h: 'Syne', 'DM Sans', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;

    --header-h: 56px;
    --sb-w: 268px;
    --radius: 8px;
    --radius-sm: 6px;
    --shadow-sm: 0 1px 2px rgba(15,23,42,0.05);
    --shadow: 0 1px 3px rgba(15,23,42,0.06), 0 1px 2px rgba(15,23,42,0.04);
    --shadow-md: 0 4px 12px rgba(15,23,42,0.08), 0 2px 4px rgba(15,23,42,0.04);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: var(--font);
    font-size: 13px;
    line-height: 1.5;
    color: var(--body);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    overflow: hidden;
  }

  /* ============================================================
     HEADER (bandeau bleu royal — fidèle PPTX)
  ============================================================ */
  .header {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: var(--header-h);
    background: var(--royal);
    color: white;
    z-index: 100;
    display: flex;
    align-items: center;
    padding: 0 20px;
  }
  .header-left {
    display: flex;
    align-items: center;
    gap: 14px;
    min-width: var(--sb-w);
    padding-right: 20px;
    border-right: 1px solid rgba(255,255,255,0.12);
    margin-right: 20px;
    height: 100%;
  }
  .h-logo {
    width: 32px; height: 32px;
    display: flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,0.15);
    color: white;
    font-family: var(--font-h);
    font-weight: 700;
    font-size: 14px;
    border-radius: 6px;
    flex-shrink: 0;
    border: 1px solid rgba(255,255,255,0.2);
  }
  .h-title {
    font-family: var(--font-h);
    font-size: 15px;
    font-weight: 700;
    letter-spacing: -0.1px;
    line-height: 1.1;
  }
  .h-sub {
    font-size: 10px;
    color: rgba(255,255,255,0.65);
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-top: 2px;
  }
  .h-context {
    font-size: 11px;
    color: rgba(255,255,255,0.7);
    letter-spacing: 1.5px;
    text-transform: uppercase;
  }
  .h-right {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .h-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 11px;
    background: rgba(255,255,255,0.95);
    color: var(--royal-d);
    border-radius: 4px;
    font-size: 11px;
    font-weight: 600;
  }
  .h-pill .ico { font-size: 12px; }
  .h-pill.live {
    background: rgba(255,255,255,0.1);
    color: white;
    border: 1px solid rgba(255,255,255,0.15);
  }
  .h-pill.live .dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--rag-green);
    box-shadow: 0 0 8px rgba(34,197,94,0.6);
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  /* ============================================================
     LAYOUT
  ============================================================ */
  .layout {
    display: flex;
    height: 100vh;
    padding-top: var(--header-h);
  }

  /* ============================================================
     SIDEBAR
  ============================================================ */
  .sb {
    width: var(--sb-w);
    background: var(--surface);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    flex-shrink: 0;
    padding-bottom: 24px;
  }
  .sb::-webkit-scrollbar { width: 6px; }
  .sb::-webkit-scrollbar-track { background: transparent; }
  .sb::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  .sb-search {
    padding: 12px 14px 8px;
    border-bottom: 1px solid var(--border);
  }
  .sb-search-box {
    width: 100%;
    padding: 7px 10px 7px 30px;
    font-size: 12px;
    border: 1px solid var(--border-2);
    border-radius: 6px;
    background: var(--surface-2);
    font-family: var(--font);
    color: var(--body);
    position: relative;
  }
  .sb-search-wrap { position: relative; }
  .sb-search-icon {
    position: absolute;
    left: 9px; top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    font-size: 13px;
    pointer-events: none;
  }
  .sb-section {
    padding: 14px 14px 6px;
    font-size: 9.5px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--muted-2);
  }

  .prog {
    border-left: 3px solid transparent;
    position: relative;
  }
  .prog-head {
    padding: 9px 14px 9px 11px;
    display: flex;
    align-items: center;
    gap: 9px;
    cursor: pointer;
    transition: background 0.12s ease;
    user-select: none;
  }
  .prog-head:hover {
    background: var(--surface-2);
  }
  .prog.open {
    background: var(--surface-2);
  }
  .prog.open .prog-head {
    background: transparent;
  }
  .prog.active {
    border-left-color: var(--gold);
    background: var(--gold-tint);
  }
  .prog.active .prog-head {
    background: transparent;
  }
  .prog-icon {
    width: 24px; height: 24px;
    border-radius: 5px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    font-size: 12px;
    font-weight: 700;
    color: white;
    background: var(--dir-vacc);
  }
  .prog[data-c="dsr"] .prog-icon { background: var(--dir-dsr); }
  .prog[data-c="dsc"] .prog-icon { background: var(--dir-dsc); }
  .prog[data-c="dpml"] .prog-icon { background: var(--dir-dpml); }
  .prog[data-c="dpsis"] .prog-icon { background: var(--dir-dpsis); }
  .prog[data-c="drh"] .prog-icon { background: var(--dir-drh); }
  .prog[data-c="cousp"] .prog-icon { background: var(--dir-cousp); }
  .prog[data-c="prog"] .prog-icon { background: var(--dir-prog); }
  .prog[data-c="min"] .prog-icon {
    background: linear-gradient(135deg, var(--gold-d), var(--gold));
    color: var(--ink);
    font-size: 10px;
    letter-spacing: -0.2px;
  }
  .prog.priority {
    border: 1.5px solid var(--gold);
    background: linear-gradient(135deg, #FFFBEB 0%, #FEF3C7 100%);
    box-shadow: 0 2px 6px rgba(202,138,4,0.15);
    margin-bottom: 10px;
  }
  .prog.priority .prog-label {
    font-weight: 700;
    color: var(--ink);
  }
  .prog.priority::before {
    content: '★';
    position: absolute;
    top: 6px; right: 8px;
    color: var(--gold-d);
    font-size: 10px;
  }
  .prog.priority { position: relative; }

  .prog-label {
    flex: 1;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--ink);
    letter-spacing: -0.1px;
  }
  .prog-count {
    font-size: 9px;
    color: var(--muted-2);
    background: var(--border);
    padding: 2px 6px;
    border-radius: 100px;
    font-weight: 600;
    margin-left: 4px;
    font-family: var(--font-mono);
  }
  .prog.active .prog-count {
    background: var(--gold);
    color: var(--ink);
  }
  .prog-chev {
    font-size: 9px;
    color: var(--muted);
    transition: transform 0.2s ease;
  }
  .prog.open .prog-chev {
    transform: rotate(90deg);
    color: var(--royal);
  }

  .subprog-list {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.3s ease;
  }
  .prog.open .subprog-list {
    max-height: 800px;
  }

  .subprog {
    padding: 7px 14px 7px 47px;
    font-size: 12px;
    color: var(--muted);
    cursor: pointer;
    position: relative;
    transition: all 0.12s ease;
    display: flex;
    align-items: center;
    gap: 7px;
  }
  .subprog::before {
    content: '';
    position: absolute;
    left: 28px; top: 50%;
    width: 10px; height: 1px;
    background: var(--border-2);
  }
  .subprog:hover {
    color: var(--ink);
    background: var(--surface-2);
  }
  .subprog.active {
    color: var(--royal-d);
    font-weight: 700;
    background: var(--royal-tint);
  }
  .subprog.active::before {
    background: var(--royal);
    width: 14px;
  }
  .subprog .sp-label { flex: 1; }
  .subprog .sp-pda-badge {
    font-size: 8px;
    font-weight: 700;
    letter-spacing: 0.5px;
    padding: 1px 5px;
    background: var(--pda);
    color: white;
    border-radius: 3px;
    margin-left: 4px;
  }
  .subprog .sp-status {
    width: 6px; height: 6px;
    border-radius: 50%;
  }
  .sp-status.green { background: var(--rag-green); }
  .sp-status.yellow { background: var(--rag-yellow); }
  .sp-status.orange { background: var(--rag-orange); }
  .sp-status.red { background: var(--rag-red); }

  .sb-footer {
    margin: 14px 12px 0;
    padding: 10px 12px;
    background: var(--royal-tint);
    border: 1px solid var(--royal-pale);
    border-radius: var(--radius-sm);
    font-size: 10.5px;
    color: var(--royal-d);
    line-height: 1.45;
  }
  .sb-footer-title {
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--royal);
    margin-bottom: 4px;
  }
  .sb-footer strong { font-weight: 700; color: var(--ink); }

  /* ============================================================
     MAIN
  ============================================================ */
  .main {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
  }
  .main::-webkit-scrollbar { width: 8px; }
  .main::-webkit-scrollbar-track { background: transparent; }
  .main::-webkit-scrollbar-thumb { background: var(--border-2); border-radius: 4px; }

  /* Topbar — sticky controls */
  .topbar {
    position: sticky;
    top: 0;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 11px 22px;
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
    min-height: 56px;
  }
  .breadcrumb {
    flex: 1;
    min-width: 180px;
    font-size: 10.5px;
    color: var(--muted);
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .breadcrumb .crumb-current {
    color: var(--royal-d);
    font-weight: 700;
  }
  .breadcrumb .sep {
    margin: 0 8px;
    color: var(--border-2);
  }

  .period-pills {
    display: inline-flex;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 3px;
  }
  .pp {
    padding: 5px 10px;
    font-size: 11px;
    font-weight: 600;
    background: transparent;
    border: none;
    color: var(--muted);
    cursor: pointer;
    border-radius: 4px;
    transition: all 0.15s ease;
    font-family: var(--font);
  }
  .pp:hover { color: var(--royal-d); }
  .pp.on {
    background: var(--royal-d);
    color: white;
    box-shadow: var(--shadow-sm);
  }

  .time-block, .scope-block {
    display: inline-flex;
    align-items: center;
    gap: 7px;
  }
  .time-label {
    font-size: 9.5px;
    font-weight: 700;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: var(--muted);
  }
  .period-sel {
    padding: 5px 26px 5px 10px;
    font-size: 11.5px;
    font-weight: 600;
    background: var(--surface) url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'%3E%3Cpath fill='%2364748B' d='M5 6L0 0h10z'/%3E%3C/svg%3E") no-repeat right 8px center;
    border: 1px solid var(--border-2);
    border-radius: 5px;
    color: var(--ink);
    font-family: var(--font);
    cursor: pointer;
    appearance: none;
    -webkit-appearance: none;
    min-width: 150px;
  }
  .period-sel:hover { border-color: var(--royal); }
  .period-sel:focus { outline: none; border-color: var(--royal); box-shadow: 0 0 0 3px rgba(30,64,175,0.12); }
  .scope-sel { min-width: 200px; }

  .scope-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 11px;
    background: var(--surface);
    border: 1px solid var(--border-2);
    border-radius: 5px;
    font-size: 11.5px;
    font-weight: 600;
    color: var(--body);
  }
  .scope-pill.pda {
    background: var(--pda-tint);
    border-color: var(--pda);
    color: var(--royal-d);
  }
  .scope-pill .ico { font-size: 13px; }

  .topbar-spacer { flex: 1; }

  /* Page header */
  .ph {
    padding: 22px 22px 4px;
  }
  .ph-tag {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: var(--royal);
    margin-bottom: 6px;
  }
  .ph-title {
    font-family: var(--font-h);
    font-size: 24px;
    font-weight: 700;
    color: var(--ink);
    letter-spacing: -0.4px;
    line-height: 1.15;
  }
  .ph-sub {
    font-size: 12.5px;
    color: var(--muted);
    margin-top: 4px;
    max-width: 760px;
  }

  /* Filter bar (PDA only) */
  .filter-bar {
    margin: 16px 22px 0;
    padding: 11px 14px;
    background: linear-gradient(90deg, var(--pda-tint) 0%, var(--royal-tint) 100%);
    border: 1px solid var(--royal-pale);
    border-radius: var(--radius);
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
  }
  .fb-left {
    flex: 1;
    min-width: 240px;
  }
  .fb-label {
    font-size: 9.5px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--royal);
    margin-bottom: 2px;
  }
  .fb-text {
    font-size: 12.5px;
    color: var(--body);
    font-weight: 500;
  }
  .fb-text strong { color: var(--royal-d); font-weight: 700; }
  .fb-toggle {
    display: inline-flex;
    background: var(--surface);
    border: 1px solid var(--border-2);
    border-radius: 6px;
    padding: 3px;
  }
  .fb-badge {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 8px 14px;
    background: white;
    border: 1px solid var(--gold);
    border-radius: 6px;
    box-shadow: var(--shadow-sm);
  }
  .fb-badge-icon {
    font-size: 20px;
    line-height: 1;
  }
  .fb-badge-tag {
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: var(--gold-d);
  }
  .fb-badge-val {
    font-family: var(--font-h);
    font-size: 13px;
    font-weight: 700;
    color: var(--ink);
    margin-top: 1px;
  }
  .fb-btn {
    padding: 6px 12px;
    font-size: 11px;
    font-weight: 600;
    background: transparent;
    border: none;
    color: var(--muted);
    cursor: pointer;
    border-radius: 4px;
    font-family: var(--font);
    transition: all 0.15s ease;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .fb-btn:hover:not(.on) { color: var(--royal-d); }
  .fb-btn.on {
    background: var(--royal);
    color: white;
  }
  .fb-btn .ct {
    background: rgba(255,255,255,0.15);
    color: white;
    padding: 1px 5px;
    border-radius: 100px;
    font-size: 9.5px;
    font-family: var(--font-mono);
  }
  .fb-btn:not(.on) .ct {
    background: var(--border);
    color: var(--muted);
  }

  /* PDA tabs (D1-D7) */
  .pda-tabs {
    margin: 16px 22px 0;
    display: flex;
    gap: 2px;
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
    scrollbar-width: thin;
    padding-bottom: 1px;
  }
  .pda-tabs::-webkit-scrollbar { height: 4px; }
  .pda-tabs::-webkit-scrollbar-thumb { background: var(--border-2); border-radius: 2px; }
  .pda-tab {
    padding: 8px 11px;
    font-size: 11px;
    font-weight: 600;
    color: var(--muted);
    border: none;
    background: transparent;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    font-family: var(--font);
    transition: all 0.15s ease;
    white-space: nowrap;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
  }
  .pda-tab:hover { color: var(--ink); }
  .pda-tab.on {
    color: var(--royal-d);
    border-bottom-color: var(--royal);
    font-weight: 700;
  }
  .pda-tab .pda-num {
    font-size: 9.5px;
    font-family: var(--font-mono);
    padding: 2px 6px;
    border-radius: 3px;
    background: var(--surface-2);
    color: var(--muted);
    font-weight: 700;
  }
  .pda-tab.on .pda-num {
    background: var(--royal-tint);
    color: var(--royal-d);
  }

  /* ============================================================
     CONTENT
  ============================================================ */
  .content {
    padding: 18px 22px 32px;
  }

  /* KPI grid */
  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 14px;
  }
  .kpi {
    background: var(--surface);
    border-radius: var(--radius);
    border: 1px solid var(--border);
    padding: 13px 14px;
    position: relative;
    overflow: hidden;
    transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
  }
  .kpi::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 4px;
  }
  .kpi::after {
    content: '';
    position: absolute;
    top: 4px; bottom: 0; left: 0;
    width: 3px;
    opacity: 0.85;
  }
  .kpi.green::before  { background: var(--rag-green); }
  .kpi.yellow::before { background: var(--rag-yellow); }
  .kpi.orange::before { background: var(--rag-orange); }
  .kpi.red::before    { background: var(--rag-red); }
  .kpi.na::before     { background: var(--rag-na); }
  .kpi.green::after  { background: var(--rag-green); }
  .kpi.yellow::after { background: var(--rag-yellow); }
  .kpi.orange::after { background: var(--rag-orange); }
  .kpi.red::after    { background: var(--rag-red); }
  .kpi.na::after     { background: var(--rag-na); }
  .kpi.green  { border-color: rgba(21,128,61,0.25); }
  .kpi.yellow { border-color: rgba(202,138,4,0.30); }
  .kpi.orange { border-color: rgba(194,65,12,0.30); }
  .kpi.red    { border-color: rgba(153,27,27,0.30); }
  .kpi.green  .kpi-value { color: var(--rag-green); }
  .kpi.yellow .kpi-value { color: #92400E; }
  .kpi.orange .kpi-value { color: var(--rag-orange); }
  .kpi.red    .kpi-value { color: var(--rag-red); }
  .kpi:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow-md);
  }
  .kpi-label {
    font-size: 10px;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 8px;
    line-height: 1.3;
    min-height: 26px;
  }
  .kpi-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 8px;
  }
  .kpi-head .kpi-label { flex: 1; }
  .kpi-rag-dot {
    width: 10px; height: 10px;
    border-radius: 100px;
    flex-shrink: 0;
    margin-top: 2px;
    box-shadow: 0 0 0 2px rgba(255,255,255,0.6);
  }
  .kpi-rag-dot.green  { background: var(--rag-green); }
  .kpi-rag-dot.yellow { background: var(--rag-yellow); }
  .kpi-rag-dot.orange { background: var(--rag-orange); }
  .kpi-rag-dot.red    { background: var(--rag-red); animation: pulse-red 2s ease-in-out infinite; }
  .kpi-rag-dot.na     { background: var(--rag-na); }
  @keyframes pulse-red {
    0%, 100% { box-shadow: 0 0 0 2px rgba(255,255,255,0.6), 0 0 0 0 rgba(153,27,27,0.45); }
    50%      { box-shadow: 0 0 0 2px rgba(255,255,255,0.6), 0 0 0 4px rgba(153,27,27,0); }
  }
  .kpi-val-row {
    display: flex;
    align-items: baseline;
    gap: 6px;
    margin-bottom: 4px;
  }
  .kpi-value {
    font-family: var(--font-h);
    font-size: 26px;
    font-weight: 700;
    color: var(--ink);
    letter-spacing: -0.5px;
    line-height: 1;
  }
  .kpi-unit {
    font-family: var(--font);
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
  }
  .kpi-meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px dashed var(--border);
  }
  .kpi-target {
    font-size: 10.5px;
    color: var(--muted);
  }
  .kpi-trend {
    font-size: 10.5px;
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    gap: 2px;
  }
  .kpi-trend.up { color: var(--rag-green); }
  .kpi-trend.down { color: var(--rag-red); }
  .kpi-trend.up.inverse { color: var(--rag-red); }
  .kpi-trend.down.inverse { color: var(--rag-green); }
  .kpi-trend.flat { color: var(--muted); }

  /* Card */
  .card {
    background: var(--surface);
    border-radius: var(--radius);
    border: 1px solid var(--border);
    overflow: hidden;
  }
  .card-hdr {
    padding: 14px 16px 0;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 10px;
  }
  .card-title {
    font-size: 13px;
    font-weight: 700;
    color: var(--ink);
    letter-spacing: -0.1px;
  }
  .card-sub {
    font-size: 11px;
    color: var(--muted);
    margin-top: 2px;
  }
  .card-body { padding: 14px 16px; }
  .card-foot {
    padding: 10px 16px;
    background: var(--surface-2);
    border-top: 1px solid var(--border);
    font-size: 10.5px;
    color: var(--muted);
  }

  /* Grids */
  .g-2-1 { display: grid; grid-template-columns: 2fr 1fr; gap: 12px; margin-bottom: 14px; }
  .g-1-2 { display: grid; grid-template-columns: 1fr 2fr; gap: 12px; margin-bottom: 14px; }
  .g-1-1 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 14px; }
  .g-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 14px; }

  /* ============================================================
     MAP — Grille structurée 5 colonnes × 6 rangées
  ============================================================ */
  .map-wrap {
    position: relative;
    background: linear-gradient(180deg, #FAFBFC 0%, #F4F6F9 100%);
    padding: 60px 16px 18px;
  }
  .map-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    grid-template-rows: repeat(6, 1fr);
    gap: 6px;
    aspect-ratio: 5/5.5;
    max-width: 540px;
    margin: 0 auto;
  }
  .map-cell {
    border-radius: 6px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: white;
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease;
    text-align: center;
    padding: 6px 4px;
    position: relative;
    overflow: hidden;
    text-shadow: 0 1px 2px rgba(0,0,0,0.3);
  }
  .map-cell.rag-green  { background: var(--rag-green); }
  .map-cell.rag-yellow { background: var(--rag-yellow); }
  .map-cell.rag-orange { background: var(--rag-orange); }
  .map-cell.rag-red    { background: var(--rag-red); }
  .map-cell.dark-text {
    color: #1F2937;
    text-shadow: none;
  }
  .map-cell.dim { opacity: 0.32; }
  .map-cell.pda-active {
    box-shadow: 0 0 0 2.5px var(--gold-d), 0 0 0 4.5px rgba(202,138,4,0.25), 0 2px 8px rgba(15,23,42,0.15);
    z-index: 2;
  }
  .map-cell.selected {
    box-shadow: 0 0 0 3px var(--royal-d), 0 0 0 5px rgba(30,58,138,0.25), 0 4px 12px rgba(30,58,138,0.2);
    z-index: 3;
  }
  .map-cell:hover {
    transform: scale(1.06);
    z-index: 4;
    box-shadow: 0 6px 16px rgba(15,23,42,0.28);
  }
  .map-cell.pda-active:hover {
    box-shadow: 0 0 0 2.5px var(--gold-d), 0 6px 16px rgba(15,23,42,0.3);
  }
  .map-cell.selected:hover {
    box-shadow: 0 0 0 3px var(--royal-d), 0 6px 16px rgba(15,23,42,0.3);
  }
  .mc-name {
    font-size: 11px;
    font-weight: 700;
    line-height: 1.15;
    margin-bottom: 3px;
    letter-spacing: -0.1px;
  }
  .mc-val {
    font-size: 15px;
    font-weight: 700;
    font-family: var(--font-mono);
    letter-spacing: -0.4px;
    line-height: 1;
  }
  .mc-pda {
    font-size: 8.5px;
    font-weight: 700;
    color: var(--gold);
    letter-spacing: 0.8px;
    margin-top: 4px;
    text-shadow: 0 1px 2px rgba(0,0,0,0.35);
  }
  .map-cell.dark-text .mc-pda {
    color: var(--gold-d);
    text-shadow: none;
  }

  /* ============================================================
     APERÇU MINISTÉRIEL — Executive dashboard
  ============================================================ */
  .ph-exec {
    background: linear-gradient(135deg, #FFFBEB 0%, #FEF3C7 100%);
    border-left: 4px solid var(--gold-d);
    padding: 18px 22px;
    margin-bottom: 0;
  }
  .ph-tag-exec {
    color: var(--gold-d) !important;
    font-weight: 700;
  }

  .exec-tabs {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    padding: 14px 22px 0;
    background: var(--surface-2);
    margin-bottom: 0;
  }
  .exec-tab {
    background: var(--surface);
    border: 1.5px solid var(--border-2);
    border-radius: 8px;
    padding: 12px 14px;
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
    transition: all 0.18s ease;
    font-family: var(--font);
    text-align: left;
    color: var(--body);
  }
  .exec-tab:hover {
    border-color: var(--royal);
    transform: translateY(-1px);
    box-shadow: var(--shadow-sm);
  }
  .exec-tab.on {
    background: linear-gradient(135deg, var(--royal-d), var(--royal));
    border-color: var(--royal-d);
    color: white;
    box-shadow: var(--shadow-md);
  }
  .et-num {
    font-family: var(--font-mono);
    font-size: 24px;
    font-weight: 800;
    letter-spacing: -1px;
    opacity: 0.8;
    color: var(--royal-d);
    min-width: 38px;
  }
  .exec-tab.on .et-num { color: var(--gold); opacity: 1; }
  .et-text { flex: 1; min-width: 0; }
  .et-label {
    font-size: 13.5px;
    font-weight: 700;
    letter-spacing: -0.2px;
    line-height: 1.2;
  }
  .et-meta {
    font-size: 10.5px;
    color: var(--muted);
    margin-top: 2px;
  }
  .exec-tab.on .et-meta { color: rgba(255,255,255,0.7); }

  .exec-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
    margin-bottom: 18px;
  }

  .kpi-exec {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px 20px;
    position: relative;
    overflow: hidden;
    transition: all 0.2s ease;
  }
  .kpi-exec::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 4px;
  }
  .kpi-exec.rag-green::before  { background: var(--rag-green); }
  .kpi-exec.rag-yellow::before { background: var(--rag-yellow); }
  .kpi-exec.rag-orange::before { background: var(--rag-orange); }
  .kpi-exec.rag-red::before    { background: var(--rag-red); }
  .kpi-exec:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow-md);
  }

  .kpe-head {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    margin-bottom: 14px;
  }
  .kpe-num {
    font-family: var(--font-mono);
    font-size: 22px;
    font-weight: 800;
    letter-spacing: -1px;
    color: var(--royal-d);
    opacity: 0.4;
    flex-shrink: 0;
    min-width: 38px;
    line-height: 1;
  }
  .kpe-title { flex: 1; min-width: 0; }
  .kpe-label {
    font-family: var(--font-h);
    font-size: 14.5px;
    font-weight: 700;
    color: var(--ink);
    letter-spacing: -0.3px;
    line-height: 1.2;
  }
  .kpe-cat {
    font-size: 10.5px;
    color: var(--muted);
    margin-top: 3px;
    font-weight: 500;
    letter-spacing: 0.3px;
  }
  .kpe-status {
    flex-shrink: 0;
    font-size: 10px;
    padding: 2px 8px;
  }

  .kpe-body {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 4px 0 10px;
  }
  .kpe-value-block { flex: 1; }
  .kpe-value {
    display: flex;
    align-items: baseline;
    gap: 4px;
    line-height: 1;
  }
  .kpe-num-big {
    font-family: var(--font-h);
    font-size: 44px;
    font-weight: 800;
    letter-spacing: -2px;
    color: var(--ink);
  }
  .kpe-unit {
    font-size: 17px;
    font-weight: 700;
    color: var(--muted);
  }
  .kpe-meta {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 8px;
    font-size: 11px;
  }
  .kpe-target {
    color: var(--muted);
  }
  .kpe-target strong {
    color: var(--ink);
    font-weight: 700;
  }
  .kpe-trend {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 3px 8px;
    border-radius: 100px;
    font-weight: 700;
    font-size: 11px;
  }
  .kpe-trend.up   { background: var(--rag-green-l); color: var(--rag-green); }
  .kpe-trend.down { background: var(--rag-red-l);   color: var(--rag-red); }
  .kpe-trend.flat { background: var(--surface-2);   color: var(--muted); }
  .kpe-trend-lbl {
    font-weight: 500;
    opacity: 0.8;
    font-size: 9.5px;
  }
  .kpe-spark-block {
    text-align: center;
    min-width: 140px;
  }
  .mini-spark {
    width: 100%;
    height: 32px;
    display: block;
  }
  .kpe-spark-lbl {
    font-size: 9px;
    color: var(--muted-2);
    margin-top: 2px;
    letter-spacing: 0.3px;
    text-transform: uppercase;
    font-weight: 600;
  }

  .kpe-action {
    background: var(--royal-tint);
    border-left: 3px solid var(--royal);
    padding: 9px 12px;
    margin-top: 10px;
    border-radius: 4px;
    display: flex;
    gap: 8px;
    font-size: 11.5px;
    color: var(--body);
    line-height: 1.4;
  }
  .kpe-action-icon {
    color: var(--royal);
    font-weight: 800;
    flex-shrink: 0;
  }

  .kpe-source {
    font-size: 10px;
    color: var(--muted-2);
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px dashed var(--border);
    letter-spacing: 0.3px;
  }

  /* Executive footer */
  .exec-footer {
    margin-top: 18px;
    background: linear-gradient(135deg, var(--ink) 0%, #1F2A44 100%);
    color: white;
    border-radius: var(--radius);
    padding: 16px 22px;
  }
  .exec-footer-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 18px;
  }
  .exec-footer-row > div {
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .ef-label {
    font-size: 9.5px;
    font-weight: 700;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: var(--gold);
  }
  .ef-val {
    font-size: 12px;
    font-weight: 500;
    color: white;
  }

  /* Language switcher */
  .lang-block {
    display: inline-flex;
    align-items: center;
  }
  .lang-pills {
    display: inline-flex;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 3px;
    gap: 2px;
  }
  .lang-btn {
    padding: 5px 9px;
    font-size: 11px;
    font-weight: 700;
    background: transparent;
    border: none;
    color: var(--muted);
    cursor: pointer;
    border-radius: 4px;
    transition: all 0.15s ease;
    font-family: var(--font);
    letter-spacing: 0.3px;
  }
  .lang-btn:hover { color: var(--royal-d); }
  .lang-btn.on {
    background: var(--royal-d);
    color: white;
    box-shadow: var(--shadow-sm);
  }

  /* RTL adjustments for Arabic */
  [dir="rtl"] body { font-family: var(--font); }
  [dir="rtl"] .sb { border-right: none; border-left: 1px solid var(--border); }
  [dir="rtl"] .breadcrumb .sep { display: inline-block; transform: scaleX(-1); }
  [dir="rtl"] .kpi::after,
  [dir="rtl"] .si-card::before {
    left: auto; right: 0;
  }
  [dir="rtl"] .ai-box { text-align: right; }
  [dir="rtl"] .kpe-action { border-left: none; border-right: 3px solid var(--royal); }
  [dir="rtl"] .pda-prov-card { text-align: right; }
  [dir="rtl"] .map-info { left: auto; right: 16px; }
  [dir="rtl"] .map-legend { right: auto; left: 16px; }
  [dir="rtl"] .map-mode-toggle { right: auto; left: 12px; }

  /* Map mode toggle (Performance ↔ Zones) */
  .map-mode-toggle {
    position: absolute;
    top: 12px; right: 12px;
    background: white;
    border: 1px solid var(--border-2);
    border-radius: 6px;
    padding: 3px;
    display: inline-flex;
    z-index: 6;
    box-shadow: var(--shadow-sm);
  }
  .mm-btn {
    padding: 5px 11px;
    font-size: 11px;
    font-weight: 600;
    background: transparent;
    border: none;
    color: var(--muted);
    cursor: pointer;
    border-radius: 4px;
    transition: all 0.15s ease;
    font-family: var(--font);
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }
  .mm-btn:hover { color: var(--royal-d); background: var(--surface-2); }
  .mm-btn.on {
    background: var(--royal-d);
    color: white;
  }
  .mm-btn.on:hover { background: var(--royal-d); }
  .mm-icon { font-size: 12px; }
  .map-legend {
    position: absolute;
    bottom: 16px; left: 16px;
    background: rgba(255,255,255,0.97);
    backdrop-filter: blur(4px);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 8px 11px;
  }
  .map-legend-title {
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 5px;
  }
  .leg-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 10px;
    color: var(--body);
    margin-bottom: 2px;
  }
  .leg-item:last-child { margin-bottom: 0; }
  .leg-dot {
    width: 11px; height: 11px;
    border-radius: 2px;
    flex-shrink: 0;
  }

  .map-info {
    position: absolute;
    top: 60px; right: 16px;
    background: rgba(255,255,255,0.97);
    backdrop-filter: blur(4px);
    border: 1px solid var(--border-2);
    border-radius: 6px;
    padding: 10px 12px;
    box-shadow: var(--shadow-md);
    min-width: 195px;
    z-index: 5;
  }
  .map-info-tag {
    font-size: 8.5px;
    font-weight: 700;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: var(--royal);
    margin-bottom: 2px;
  }
  .map-info-name {
    font-family: var(--font-h);
    font-size: 12.5px;
    font-weight: 700;
    color: var(--ink);
    margin-bottom: 6px;
  }
  .map-info-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 10.5px;
    padding: 2px 0;
    border-bottom: 1px solid var(--border);
  }
  .map-info-row:last-child { border-bottom: none; }
  .map-info-val {
    font-family: var(--font-mono);
    font-weight: 700;
    color: var(--ink);
  }
  .map-info-pda {
    display: inline-block;
    background: var(--pda);
    color: white;
    font-size: 9px;
    font-weight: 700;
    padding: 2px 6px;
    border-radius: 3px;
    margin-left: 6px;
    vertical-align: middle;
  }

  /* ============================================================
     BARS / CHART
  ============================================================ */
  .bar-list {
    display: flex;
    flex-direction: column;
    gap: 5px;
  }
  .bar-row {
    display: grid;
    grid-template-columns: 150px 1fr 56px;
    align-items: center;
    gap: 10px;
    padding: 4px 0;
  }
  .bar-label {
    font-size: 11.5px;
    color: var(--body);
    font-weight: 500;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .bar-track {
    height: 8px;
    background: var(--surface-2);
    border-radius: 100px;
    position: relative;
    overflow: visible;
  }
  .bar-fill {
    height: 100%;
    border-radius: 100px;
    transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    background: var(--royal);
  }
  .bar-fill.green { background: var(--rag-green); }
  .bar-fill.yellow { background: var(--rag-yellow); }
  .bar-fill.orange { background: var(--rag-orange); }
  .bar-fill.red { background: var(--rag-red); }
  .bar-target {
    position: absolute;
    top: -3px; bottom: -3px;
    width: 2px;
    background: var(--ink);
    opacity: 0.55;
    border-radius: 2px;
  }
  .bar-val {
    font-family: var(--font-mono);
    font-size: 11.5px;
    font-weight: 700;
    text-align: right;
  }
  .bar-val.green { color: var(--rag-green); }
  .bar-val.yellow { color: var(--rag-yellow); }
  .bar-val.orange { color: var(--rag-orange); }
  .bar-val.red { color: var(--rag-red); }

  /* Sparkline / line chart */
  .chart-svg {
    width: 100%;
    height: 200px;
  }
  .chart-legend {
    display: flex;
    gap: 14px;
    padding: 6px 0 0 0;
    flex-wrap: wrap;
  }
  .cl-item {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 10.5px;
    color: var(--body);
  }
  .cl-mark {
    width: 16px; height: 2px;
    border-radius: 2px;
  }

  /* Data table */
  .dt {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
  }
  .dt th {
    text-align: left;
    font-size: 9.5px;
    font-weight: 700;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: var(--muted);
    padding: 8px 10px;
    background: var(--surface-2);
    border-bottom: 1px solid var(--border);
  }
  .dt td {
    padding: 9px 10px;
    border-bottom: 1px solid var(--border);
    color: var(--body);
  }
  .dt td.num {
    text-align: right;
    font-family: var(--font-mono);
    font-weight: 600;
  }

/* ==============================================================
   DUMMY DATA GENERATOR — Seeded, coherent
============================================================== */
// Seeded random per (province, indicator, month) — gives stable but realistic numbers
function seedRandom(seed) {
  let x = Math.sin(seed) * 10000;
  return x - Math.floor(x);
}
function hash(...args) {
  let h = 0;
  const str = args.join('|');
  for (let i = 0; i < str.length; i++) {
    h = ((h << 5) - h) + str.charCodeAt(i);
    h |= 0;
  }
  return Math.abs(h);
}

// Generate value for a metric × province
function genValue(metric, provId, monthOffset = 0) {
  const seed = hash(metric, provId, monthOffset);
  const r = seedRandom(seed);

  // Base profiles by province (some provinces consistently weaker — Sahelian band)
  const profiles = {
    // North/Sahel — weaker performance generally
    TIB:0.25, BRK:0.30, EOU:0.32, EES:0.35, KAN:0.40, BAR:0.45, BAT:0.55, WAD:0.50,
    LAC:0.42, HDL:0.55, OUA:0.50, SIL:0.60,
    // Center
    NDJ:0.88, CBG:0.72, GUE:0.65, SAL:0.62,
    // South — better performance
    MKO:0.72, MKE:0.75, TAN:0.80, LOO:0.82, LOE:0.85, MAN:0.78, MCH:0.80
  };
  const base = profiles[provId] || 0.5;

  // Metric-specific scaling
  let val;
  if (metric.startsWith("couv") || metric.startsWith("compl") || metric === "var2" || metric === "penta3") {
    val = Math.round((base * 70 + r * 25) * 1.2);  // coverage 30-90%
  } else if (metric === "rupture" || metric === "abandon" || metric === "perim") {
    val = Math.round((1 - base) * 35 + r * 10);  // 5-35%, inverse
  } else if (metric === "mortmat") {
    val = Math.round((1 - base) * 600 + 200 + r * 80);  // mortality /100k
  } else if (metric === "zd-volume") {
    // Don't apply final 0-100 cap (return raw count)
    return Math.round((1 - base) * 8000 + r * 1500);
  } else if (metric.startsWith("pda-D")) {
    // PDA domain composite score per province
    const domainSeed = hash(metric, provId);
    const profileBoost = PDA_PROVINCES.includes(provId) ? 0.15 : -0.10;
    val = Math.round((base + profileBoost) * 60 + seedRandom(domainSeed) * 25 + 10);
  } else if (metric.startsWith("pda-d")) {
    // Individual PDA indicator
    val = Math.round(base * 70 + r * 25 + 5);
  } else {
    val = Math.round(base * 70 + r * 20);
  }

  return Math.max(0, Math.min(100, val));
}

// Map of values for a metric across all 23 provinces
function provincesValueMap(metric) {
  const m = {};
  PROVINCES.forEach(p => { m[p.id] = genValue(metric, p.id); });
  return m;
}

// 12-month sparkline for an indicator (national or PDA aggregate, or single province)
function sparklineData(metric, scope = "national") {
  // Single province filter takes priority
  if (state.provinceFilter) {
    const series = [];
    for (let m = 11; m >= 0; m--) {
      series.push(genValue(metric, state.provinceFilter, m));
    }
    return series;
  }
  const provs = scope === "pda" ? PDA_PROVINCES : PROVINCES.map(p => p.id);
  const series = [];
  for (let m = 11; m >= 0; m--) {
    let sum = 0;
    provs.forEach(pId => { sum += genValue(metric, pId, m); });
    series.push(Math.round(sum / provs.length));
  }
  return series;
}

// National (weighted) aggregate value — respects provinceFilter
function nationalAggregate(metric, scope = "national") {
  // Individual province filter takes priority
  if (state.provinceFilter) {
    return genValue(metric, state.provinceFilter);
  }
  const provs = scope === "pda" ? PDA_PROVINCES : PROVINCES.map(p => p.id);
  let sum = 0;
  provs.forEach(pId => { sum += genValue(metric, pId); });
  return Math.round(sum / provs.length);
}

/* ==============================================================
   RAG helpers
============================================================== */
function rag(val, target, inverse = false) {
  if (val === null || val === undefined) return "na";
  if (inverse) {
    if (val <= target * 0.5) return "green";
    if (val <= target) return "yellow";
    if (val <= target * 1.5) return "orange";
    return "red";
  }
  if (val >= target) return "green";
  if (val >= target * 0.85) return "yellow";
  if (val >= target * 0.65) return "orange";
  return "red";
}
function ragLabel(r) {
  return { green:t("rag_green"), yellow:t("rag_yellow"), orange:t("rag_orange"), red:t("rag_red"), na:"—" }[r] || "—";
}

const fmt = n => {
  const locale = state && state.lang === "en" ? "en-US" : state && state.lang === "ar" ? "ar-EG" : "fr-FR";
  return new Intl.NumberFormat(locale).format(n);
};

function t(key) {
  const dict = I18N[state.lang] || I18N.fr;
  return dict[key] !== undefined ? dict[key] : (I18N.fr[key] !== undefined ? I18N.fr[key] : key);
}

function setLang(lang) {
  state.lang = lang;
  // Direction (RTL for Arabic)
  document.documentElement.setAttribute("lang", lang);
  document.documentElement.setAttribute("dir", lang === "ar" ? "rtl" : "ltr");
  // Update static chrome
  applyStaticTranslations();
  // Re-render dynamic content
  renderSidebar();
  renderMain();
}

function applyStaticTranslations() {
  const m = {

function toggleProgram(progId) {
  document.querySelectorAll(".prog").forEach(el => {
    if (el.dataset.prog === progId) el.classList.toggle("open");
    else el.classList.remove("open");
  });
}

function selectSub(progId, subId) {
  state.program = progId;
  state.sub = subId;
  // Entering PDA: force scope to PDA and reset province filter to non-PDA values
  if (subId === "vacc-pda") {
    state.scope = "pda";
    state.pdaDomain = "overview";
    // If active province filter is not a PDA province, clear it
    if (state.provinceFilter && !PDA_PROVINCES.includes(state.provinceFilter)) {
      state.provinceFilter = null;
      document.getElementById("h-scope").textContent = "3 Provinces PDA";
    }
  }
  // Leaving PDA: reset scope to national
  if (subId !== "vacc-pda") {
    state.scope = "national";
  }
  document.querySelectorAll(".prog").forEach(el => {
    el.classList.toggle("active", el.dataset.prog === progId);
    el.classList.toggle("open", el.dataset.prog === progId);
  });
  document.querySelectorAll(".subprog").forEach(el => {
    el.classList.toggle("active", el.dataset.sub === subId);
  });
  renderMain();
}

  if (state.provinceFilter) {

    if (p && !v.crumbs[v.crumbs.length - 1].includes(p.name)) {
      v.crumbs[v.crumbs.length - 1] = v.crumbs[v.crumbs.length - 1] + ' · ' + p.name;

  document.getElementById("main").innerHTML = `<div class="fade-in">${renderTopbar(v)}${renderProvinceBanner()}${v.html}</div>`;

// Mini sparkline for executive KPI
function miniSpark(data, color = "#1E40AF") {
  if (!data || data.length === 0) return '';
  const w = 140, h = 32;
  const max = Math.max(...data) * 1.08;
  const min = Math.min(...data) * 0.92;
  const range = max - min || 1;
  const xStep = w / (data.length - 1);
  const points = data.map((v, i) => {
    const x = i * xStep;
    const y = h - ((v - min) / range) * h;
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  });
  const linePts = points.join(" ");
  const areaPts = points.join(" ") + ` ${w},${h} 0,${h}`;
  const lastX = (data.length - 1) * xStep;
  const lastY = h - ((data[data.length - 1] - min) / range) * h;
  return `
    <svg class="mini-spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
      <polygon points="${areaPts}" fill="${color}" opacity="0.08"/>
      <polyline points="${linePts}" fill="none" stroke="${color}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="${lastX.toFixed(1)}" cy="${lastY.toFixed(1)}" r="2.8" fill="${color}" stroke="white" stroke-width="1.2"/>
    </svg>
  `;
}

// Executive KPI card
function kpiExec(opts) {
  const { n, label, category, value, unit, target, trend, trendDir, rag, source, sparkData, sparkColor, action } = opts;
  const arrow = trendDir === "up" ? "↑" : trendDir === "down" ? "↓" : "→";
  return `
    <div class="kpi-exec rag-${rag}">
      <div class="kpe-head">
        <div class="kpe-num">${n}</div>
        <div class="kpe-title">
          <div class="kpe-label">${label}</div>
          <div class="kpe-cat">${category}</div>
        </div>
        <span class="pill ${rag} kpe-status">${ragLabel(rag)}</span>
      </div>
      <div class="kpe-body">
        <div class="kpe-value-block">
          <div class="kpe-value">
            <span class="kpe-num-big">${value}</span>
            <span class="kpe-unit">${unit}</span>
          </div>
          <div class="kpe-meta">
            <span class="kpe-target">${t("target")} : <strong>${target}${unit || ""}</strong></span>
            <span class="kpe-trend ${trendDir}">${arrow} ${trend} <span class="kpe-trend-lbl">${t("trend_vs")}</span></span>
          </div>
        </div>
        <div class="kpe-spark-block">
          ${miniSpark(sparkData || [], sparkColor || "#1E40AF")}
          <div class="kpe-spark-lbl">${t("twelve_months")}</div>
        </div>
      </div>
      ${action ? `<div class="kpe-action"><span class="kpe-action-icon">▶</span><span>${action}</span></div>` : ''}
      <div class="kpe-source">${t("source")} : ${source}</div>
    </div>
  `;
}

  };

function renderPdaDomain(domId) {
  const dom = PDA_DOMAINS.find(d => d.id === domId);
  const indicators = PDA_IND[domId] || [];
  const focusedProv = state.provinceFilter && PDA_PROVINCES.includes(state.provinceFilter) ? state.provinceFilter : null;

  // Generate value per indicator × province (always PDA_PROVINCES only)
  const valByProvince = {};
  PDA_PROVINCES.forEach(pId => {
    valByProvince[pId] = indicators.map(ind => ({
      ...ind,
      val: genValue("pda-" + ind.id, pId)
    }));
  });

  // PDA-only aggregation: 1 focused province or 3 PDA provinces (never 23 extrapolation)
  let indAverages;
  if (focusedProv) {
    indAverages = indicators.map(ind => ({
      ...ind,
      val: genValue("pda-" + ind.id, focusedProv)
    }));
  } else {
    indAverages = indicators.map(ind => {
      let sum = 0;
      PDA_PROVINCES.forEach(pId => { sum += genValue("pda-" + ind.id, pId); });
      return { ...ind, val: Math.round(sum / PDA_PROVINCES.length) };
    });
  }

  const domAvg = Math.round(indAverages.reduce((a,i) => a+i.val, 0) / indAverages.length);

  const meetTarget = indAverages.filter(i => i.obj ? (i.dir === "gte" ? i.val >= i.obj : i.val <= i.obj) : false).length;
  const meetRatio = meetTarget / indicators.length;
  const meetRag = meetRatio >= 0.7 ? "green" : meetRatio >= 0.5 ? "yellow" : meetRatio >= 0.3 ? "orange" : "red";

  const scopeLabel = focusedProv
    ? `Focus ${PROVINCES.find(p => p.id === focusedProv).name}`
    : `Moyenne 13 provinces pilotes PDA`;

  return `
    <div class="kpi-grid">
      ${kpi(`Score ${domId}${focusedProv ? ' · ' + PROVINCES.find(p=>p.id===focusedProv).short : ''}`, domAvg, "%", "Cible : 80%", "+4 pts", "up", rag(domAvg, 80))}
      ${kpi("Indicateurs suivis", String(indicators.length), "", "Tous mis à jour", "Stable", "flat", "green")}
      ${kpi("Provinces couvertes", focusedProv ? "1" : "13", "/13 PDA", "Pilote · Vague 1", "Stable", "flat", "yellow")}
      ${kpi("Indicateurs ≥ cible", String(meetTarget) + "/" + indicators.length, "", "Performance T1", "+2", "up", meetRag)}
    </div>

    <div class="card" style="margin-bottom:14px;">
      <div class="card-hdr">
        <div>
          <div class="card-title">${dom.icon} Domaine ${dom.code} — ${dom.label}</div>
          <div class="card-sub">Performance par indicateur · ${scopeLabel}</div>
        </div>
      </div>
      <div class="card-body">
        ${renderBars(indAverages.map(ind => ({
          label: ind.l.substring(0,30),
          val: ind.val,
          target: ind.obj,
          rag: ind.obj ? rag(ind.val, ind.obj, ind.dir === "lte") : "yellow",
          showVal: ind.val + "%",
          max: 100
        })))}
      </div>
      <div class="card-foot">Cible : variable selon indicateur · Source : DHIS2 / Rapports DSP / SIGL · 13 provinces PDA uniquement</div>
    </div>

    <div class="g-2-1">
      ${card(`Comparaison 13 provinces PDA — ${domId}`, focusedProv ? `${PROVINCES.find(p=>p.id===focusedProv).name} mise en évidence` : "Score domaine par province", `
        <table class="dt">
          <thead><tr><th>Indicateur</th>${PDA_PROVINCES.map(p => {
            const isFocus = focusedProv === p;
            return `<th style="text-align:right;${isFocus?'background:var(--gold-tint);color:var(--gold-d);':''}">${p}${isFocus?' ★':''}</th>`;
          }).join("")}<th style="text-align:right">Moy.</th></tr></thead>
          <tbody>
            ${indicators.map(ind => {
              const vals = PDA_PROVINCES.map(pId => valByProvince[pId].find(i => i.id === ind.id).val);
              const avg = Math.round(vals.reduce((a,b) => a+b, 0) / vals.length);
              return `<tr>
                <td class="l">${ind.l}</td>
                ${vals.map((v, idx) => {
                  const pId = PDA_PROVINCES[idx];
                  const isFocus = focusedProv === pId;
                  const r = ind.obj ? rag(v, ind.obj, ind.dir === "lte") : "yellow";
                  return `<td class="num" style="${isFocus?'background:var(--gold-tint);':''}"><span class="pill ${r}" style="min-width:42px;text-align:center;">${v}%</span></td>`;
                }).join("")}
                <td class="num"><strong>${avg}%</strong></td>
              </tr>`;
            }).join("")}
          </tbody>
        </table>
      `, "")}

      ${card("Cartographie " + domId, focusedProv ? `${PROVINCES.find(p=>p.id===focusedProv).name} sélectionnée` : "13 provinces pilotes PDA", renderMap("pda-" + domId, { pdaFocus: true }), "")}
    </div>

    ${aiBox(
      `Analyse du domaine ${domId} — ${dom.label}`,
      domainNarrative(domId, domAvg, indAverages),
      "Source : DHIS2 + DSP · Triangulation J+5 · 13 provinces PDA · Période : " + periodLabel()
    )}
  `;
}

  const narratives = {
    D1: `La <strong>gouvernance financière du PDA</strong> atteint ${avg}% sur la période. Les revues semestrielles et trimestrielles sont en bonne voie, mais les <strong>pièces justificatives validées</strong> restent un goulet d'étranglement (impact sur tranches T2). Recommandation : <strong>renforcer la cellule de gestion financière au niveau DLMVSE</strong>.`,

   COMPONENT HELPERS
============================================================== */
function kpi(label, val, unit, target, trend, dir, ragClass, inverse = false) {
  const trendCls = dir === "up" ? "up" : dir === "down" ? "down" : "flat";
  const arrow = dir === "up" ? "↗" : dir === "down" ? "↘" : "→";
  return `
    <div class="kpi ${ragClass}">
      <div class="kpi-head">
        <div class="kpi-label">${label}</div>
        <span class="kpi-rag-dot ${ragClass}" title="${ragLabel(ragClass)}"></span>
      </div>
      <div class="kpi-val-row">
        <div class="kpi-value">${val}</div>
        <div class="kpi-unit">${unit}</div>
      </div>
      <div class="kpi-meta">
        <div class="kpi-target">${target}</div>
        <div class="kpi-trend ${trendCls} ${inverse ? 'inverse' : ''}">${arrow} ${trend}</div>
      </div>
    </div>
  `;
}

function card(title, subtitle, body, footer) {

    <div class="card">
      <div class="card-hdr">

          <div class="card-title">${title}</div>

        </div>
      </div>
      <div class="card-body">${body}</div>

  `;
}

function renderBars(bars) {
  return `<div class="bar-list">
    ${bars.map(b => {
      const max = b.max || 100;
      const pct = Math.min(100, (b.val / max) * 100);
      const targetPct = b.target ? Math.min(100, (b.target / max) * 100) : null;
      const ragCls = b.rag || "navy";
      return `
        <div class="bar-row">
          <div class="bar-label">${b.label}</div>
          <div class="bar-track">
            <div class="bar-fill ${ragCls}" data-w="${pct}" style="width:0%;"></div>
            ${targetPct ? `<div class="bar-target" style="left:${targetPct}%;"></div>` : ''}
          </div>
          <div class="bar-val ${ragCls}">${b.showVal || b.val + '%'}</div>
        </div>
      `;
    }).join("")}
  </div>`;
}

function renderLineChart(series, opts = {}) {
  const w = 480, h = 200, p = { t:18, r:16, b:28, l:34 };
  const allData = series.flatMap(s => s.data);
  const min = Math.min(...allData);
  const max = Math.max(...allData);
  const range = max - min || 1;
  const padding = range * 0.1;
  const yMin = Math.max(0, min - padding);
  const yMax = max + padding;
  const yRange = yMax - yMin;
  const innerW = w - p.l - p.r;
  const innerH = h - p.t - p.b;
  const xStep = innerW / (series[0].data.length - 1);

  const months = ['M-11','M-10','M-9','M-8','M-7','M-6','M-5','M-4','M-3','M-2','M-1','M'];
  const lines = series.map((s, idx) => {
    const path = s.data.map((v, i) => {
      const x = p.l + i * xStep;
      const y = p.t + innerH - ((v - yMin) / yRange) * innerH;
      return `${i === 0 ? 'M' : 'L'} ${x.toFixed(1)} ${y.toFixed(1)}`;
    }).join(" ");

    // Area fill (only for solid lines)
    const areaPath = (s.style !== 'dashed') ? path + ` L ${p.l + (s.data.length-1) * xStep} ${p.t + innerH} L ${p.l} ${p.t + innerH} Z` : '';

    const dots = s.style === 'dashed' ? '' : s.data.map((v, i) => {
      const x = p.l + i * xStep;
      const y = p.t + innerH - ((v - yMin) / yRange) * innerH;
      return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2.5" fill="${s.color}" stroke="white" stroke-width="1"/>`;
    }).join("");
    return {
      path, areaPath, dots,
      name: s.name, color: s.color,
      style: s.style || 'solid',
      opacity: s.opacity || 1
    };
  });

  const yTicks = 4;
  const grid = [];
  for (let i = 0; i <= yTicks; i++) {
    const v = yMin + (yRange * i / yTicks);
    const y = p.t + innerH - (innerH * i / yTicks);
    grid.push(`<line x1="${p.l}" y1="${y.toFixed(1)}" x2="${w-p.r}" y2="${y.toFixed(1)}" stroke="#E2E8F0" stroke-width="0.5" stroke-dasharray="2 3"/>`);
    grid.push(`<text x="${p.l-6}" y="${(y+3).toFixed(1)}" font-size="9" fill="#94A3B8" text-anchor="end" font-family="JetBrains Mono">${Math.round(v)}</text>`);
  }

  const xLabels = months.map((m, i) => {
    if (i % 2 !== 0 && i !== months.length - 1) return '';
    const x = p.l + i * xStep;
    return `<text x="${x.toFixed(1)}" y="${h-6}" font-size="9" fill="#94A3B8" text-anchor="middle">${m}</text>`;
  }).join("");

  // Areas (rendered first, behind lines)
  const areas = lines.filter(l => l.style !== 'dashed').map((l, idx) =>
    `<path d="${l.areaPath}" fill="${l.color}" opacity="${l.style === 'dashed' ? 0.04 : 0.08}"/>`
  ).join("");

  return `
    <svg class="chart-svg" viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet">
      ${grid.join("")}
      ${xLabels}
      ${areas}
      ${lines.map(l => `
        <path d="${l.path}"
          stroke="${l.color}"
          stroke-width="${l.style === 'dashed' ? 1.5 : 2.2}"
          fill="none"
          stroke-linecap="round"
          stroke-linejoin="round"
          opacity="${l.opacity}"
          ${l.style === 'dashed' ? 'stroke-dasharray="4 3"' : ''}
        />
      `).join("")}
      ${lines.map(l => l.dots).join("")}
    </svg>
    <div class="chart-legend">
      ${lines.map(l => `
        <div class="cl-item">
          <span class="cl-mark" style="background:${l.color}; ${l.style === 'dashed' ? 'border:1px dashed '+l.color+'; background:transparent; height:0;' : ''}; opacity:${l.opacity}"></span>${l.name}
        </div>
      `).join("")}
    </div>
  `;
}

// Helper to build YoY chart series (current year solid + N-1 dashed)
function yoySeriesData(metric, scope = "national") {
  const currentYear = sparklineData(metric, scope);
  // Previous year — slightly lower values (use different seed offset)
  const prevYear = currentYear.map((v, i) => {
    const noise = (Math.sin(hash(metric, i, 'prev')) * 8) - 4;
    return Math.max(0, Math.min(100, Math.round(v - 4 + noise)));
  });
  return [
    { name: "Année 2026 (courante)", data: currentYear, color: "#1E40AF", style: "solid", opacity: 1 },
    { name: "Année 2025 (N-1)",      data: prevYear,    color: "#94A3B8", style: "dashed", opacity: 0.85 },
  ];
}

/* ==============================================================
   MAP RENDERING
============================================================== */
function renderMap(metric, opts = {}) {
  const inverse = opts.inverse || false;
  const isVolume = opts.isVolume || metric === "zd-volume";
  const pdaFocus = opts.pdaFocus || (state.sub === "vacc-pda");
  const valMap = provincesValueMap(metric);

  function getRag(val) {
    if (isVolume) {
      if (val <= 2500) return "green";
      if (val <= 4500) return "yellow";
      if (val <= 6500) return "orange";
      return "red";
    }
    if (inverse || metric === "rupture" || metric === "abandon" || metric === "perim") {
      if (val <= 30) return "green";
      if (val <= 50) return "yellow";
      if (val <= 70) return "orange";
      return "red";
    }
    if (val >= 80) return "green";
    if (val >= 60) return "yellow";
    if (val >= 40) return "orange";
    return "red";
  }

  function dispVal(v) {
    if (isVolume) return fmt(v);
    return v + "%";
  }

  // Each province as a grid cell
  const cells = PROVINCES.map(p => {
    const val = valMap[p.id];
    const r = getRag(val);
    const isPda = PDA_PROVINCES.includes(p.id);
    const isSelected = state.provinceFilter === p.id;

    let cls = "map-cell";
    let inlineBg = "";
    let darkText = false;

    if (state.mapMode === "zones") {
      const zone = ZONES[PROV_ZONE[p.id]];
      inlineBg = `background:${zone.color};`;
      darkText = zone.textDark;
    } else {
      cls += ` rag-${r}`;
      darkText = (r === "yellow");
    }
    if (darkText) cls += " dark-text";

    if (pdaFocus && !isPda) cls += " dim";
    if (pdaFocus && isPda) cls += " pda-active";
    if (isSelected) cls += " selected";

    return `
      <div class="${cls}" style="grid-row:${p.gR};grid-column:${p.gC};${inlineBg}"
        onclick="showProvInfo('${p.id}', '${metric}', ${isVolume}); setProvinceFilter('${p.id}')"
        title="${p.name} — ${dispVal(val)} · ${ZONES[PROV_ZONE[p.id]].name}">
        <div class="mc-name">${p.short}</div>
        <div class="mc-val">${dispVal(val)}</div>
        ${isPda ? '<div class="mc-pda">★ PDA</div>' : ''}
      </div>
    `;
  }).join("");

  const defaultProv = state.provinceFilter || (pdaFocus ? "LAC" : "NDJ");
  const infoProv = PROVINCES.find(p => p.id === defaultProv);
  const infoVal = valMap[defaultProv];
  const infoRag = getRag(infoVal);
  const infoZone = ZONES[PROV_ZONE[defaultProv]];

  // Toggle
  const modeToggle = `
    <div class="map-mode-toggle">
      <button class="mm-btn ${state.mapMode === 'performance' ? 'on' : ''}" onclick="setMapMode('performance')" title="Couleurs par performance (RAG)">
        <span class="mm-icon">📊</span> Performance
      </button>
      <button class="mm-btn ${state.mapMode === 'zones' ? 'on' : ''}" onclick="setMapMode('zones')" title="Couleurs par zone agroclimatique">
        <span class="mm-icon">🌍</span> Zones
      </button>
    </div>
  `;

  // Legend depends on mode
  let legendHtml;
  if (state.mapMode === "zones") {
    legendHtml = `
      <div class="map-legend-title">Zones agroclimatiques</div>
      <div class="leg-item"><span class="leg-dot" style="background:${ZONES.SAH.color}"></span>Saharienne (${ZONES.SAH.count})</div>
      <div class="leg-item"><span class="leg-dot" style="background:${ZONES.SHL.color}"></span>Sahélienne (${ZONES.SHL.count})</div>
      <div class="leg-item"><span class="leg-dot" style="background:${ZONES.SDN.color}"></span>Soudanienne (${ZONES.SDN.count})</div>
      ${pdaFocus ? '<div class="leg-item" style="margin-top:5px;padding-top:5px;border-top:1px solid var(--border);"><span class="leg-dot" style="background:var(--gold);"></span>Provinces PDA (★)</div>' : ''}
    `;
  } else {
    legendHtml = `
      <div class="map-legend-title">Performance</div>
      <div class="leg-item"><span class="leg-dot" style="background:var(--rag-green)"></span>Bon</div>
      <div class="leg-item"><span class="leg-dot" style="background:var(--rag-yellow)"></span>À surveiller</div>
      <div class="leg-item"><span class="leg-dot" style="background:var(--rag-orange)"></span>Attention</div>
      <div class="leg-item"><span class="leg-dot" style="background:var(--rag-red)"></span>Critique</div>
      ${pdaFocus ? '<div class="leg-item" style="margin-top:5px;padding-top:5px;border-top:1px solid var(--border);"><span class="leg-dot" style="background:var(--gold);"></span>Provinces PDA (★)</div>' : ''}
    `;
  }

  return `
    <div class="map-wrap">
      ${modeToggle}
      <div class="map-grid">
        ${cells}
      </div>
      <div class="map-legend">${legendHtml}</div>
      <div class="map-info" id="map-info">
        <div class="map-info-tag">📍 ${PDA_PROVINCES.includes(defaultProv) ? "Province PDA" : "Province"}</div>
        <div class="map-info-name">${infoProv.name}${PDA_PROVINCES.includes(defaultProv) ? '<span class="map-info-pda">PDA</span>' : ''}</div>
        <div class="map-info-row"><span>Zone</span><span class="map-info-val" style="color:${infoZone.textDark ? '#5A3F1A' : infoZone.color};font-weight:700;">${infoZone.name}</span></div>
        <div class="map-info-row"><span>Valeur</span><span class="map-info-val">${dispVal(infoVal)}</span></div>
        <div class="map-info-row"><span>Statut</span><span class="map-info-val"><span class="pill ${infoRag}">${ragLabel(infoRag)}</span></span></div>
        <div class="map-info-row"><span>Tendance N-1</span><span class="map-info-val">+${Math.abs((hash(defaultProv, metric) % 9) - 4)} pts</span></div>
      </div>
    </div>
  `;
}

function showProvInfo(provId, metric, isVolume) {
  const p = PROVINCES.find(x => x.id === provId);
  if (!p) return;
  const val = genValue(metric, provId);
  const isPda = PDA_PROVINCES.includes(provId);
  const inverse = metric === "rupture" || metric === "abandon" || metric === "perim" || isVolume;
  let r;
  if (isVolume) {
    r = val <= 2500 ? "green" : val <= 4500 ? "yellow" : val <= 6500 ? "orange" : "red";
  } else if (inverse) {
    r = val <= 30 ? "green" : val <= 50 ? "yellow" : val <= 70 ? "orange" : "red";
  } else {
    r = val >= 80 ? "green" : val >= 60 ? "yellow" : val >= 40 ? "orange" : "red";
  }
  const trend = ((hash(provId, metric, 'trend') % 11) - 5);
  const display = isVolume ? fmt(val) : val + "%";

  const info = document.getElementById("map-info");
  if (info) {
    info.innerHTML = `
      <div class="map-info-tag">📍 ${isPda ? "Province PDA" : "Province"}</div>
      <div class="map-info-name">${p.name}${isPda ? '<span class="map-info-pda">PDA</span>' : ''}</div>
      <div class="map-info-row"><span>Valeur</span><span class="map-info-val">${display}</span></div>
      <div class="map-info-row"><span>Statut</span><span class="map-info-val"><span class="pill ${r}">${ragLabel(r)}</span></span></div>
      <div class="map-info-row"><span>Tendance N-1</span><span class="map-info-val">${trend >= 0 ? '+' : ''}${trend} pts</span></div>
    `;
  }
}

/* ==============================================================
   INIT
============================================================== */
function init() {
  applyStaticTranslations();
  document.documentElement.setAttribute("lang", state.lang);
  document.documentElement.setAttribute("dir", state.lang === "ar" ? "rtl" : "ltr");
  renderSidebar();
  // Open vaccination program by default and select PDA
  setTimeout(() => {
    document.querySelector('.prog[data-prog="vacc"]').classList.add("open", "active");
    document.querySelector('.subprog[data-sub="vacc-overview"]').classList.add("active");
    renderMain();
  }, 30);
}

init();
</script>
